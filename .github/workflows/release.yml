name: Release

# Builds and uploads the release assets for macOS, Linux and Windows — runs ONLY
# when a GitHub release is published (or manually for a tag), so no CI minutes
# are spent on pushes.
#
# Release flow:
#   1. Tag + publish a GitHub release (tag like v0.2.0).
#   2. Each OS's job builds at that version and uploads its installers, plus —
#      when the updater signing secrets are present — its updater bundle and
#      minisign signature.
#   3. Once all three have succeeded, `manifest` merges their parts into
#      latest.json. The app's updater plugin polls
#      releases/latest/download/latest.json, so that upload IS the update
#      rollout. If any OS fails there's no manifest, and nobody is offered the
#      release until a re-run succeeds.
#
# Required repo secrets for the in-app update path (same key pair as
# claude-orchestrator): TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. Without them the workflow still uploads
# the installers, just no updater assets.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build/upload (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.event.release.tag_name }}

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Prepare
        id: setup
        uses: ./.github/actions/release-setup
        with:
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build app (+ updater artifacts when signing is enabled)
        env:
          HAS_SIGNING: ${{ steps.setup.outputs.has_signing }}
        run: |
          set -euo pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --bundles app
          fi

      - name: Package release assets
        env:
          HAS_SIGNING: ${{ steps.setup.outputs.has_signing }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          APP_SOURCE="src-tauri/target/release/bundle/macos/trace.app"
          mkdir -p builds release-assets
          rm -rf "builds/trace.app"
          ditto "$APP_SOURCE" "builds/trace.app"

          # Re-sign ad-hoc if staging broke the signature (unsigned dev cert).
          if ! codesign --verify --deep --strict "builds/trace.app"; then
            codesign --force --deep --sign - "builds/trace.app"
          fi

          # DMG with the conventional /Applications shortcut.
          rm -rf builds/dmg-root && mkdir -p builds/dmg-root
          ditto "builds/trace.app" "builds/dmg-root/trace.app"
          ln -sfn /Applications "builds/dmg-root/Applications"
          hdiutil create -volname "trace" -srcfolder "builds/dmg-root" -ov -format UDZO "release-assets/trace-${TAG}-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent "builds/trace.app" "release-assets/trace-${TAG}-macos-app.zip"

          if [ "$HAS_SIGNING" != "true" ]; then
            echo "Updater signing disabled; skipping updater assets."
            exit 0
          fi

          UPDATER_SOURCE="$(find src-tauri/target/release/bundle -type f -name '*.app.tar.gz' | head -n 1)"
          UPDATER_SIG_SOURCE="$(find src-tauri/target/release/bundle -type f -name '*.app.tar.gz.sig' | head -n 1)"
          if [ -z "$UPDATER_SOURCE" ] || [ -z "$UPDATER_SIG_SOURCE" ]; then
            echo "::error::Updater bundle or signature not found after a signed build."
            exit 1
          fi
          UPDATER_FILE="trace-${TAG}-macos-updater.tar.gz"
          cp "$UPDATER_SOURCE" "release-assets/$UPDATER_FILE"
          cp "$UPDATER_SIG_SOURCE" "release-assets/${UPDATER_FILE}.sig"

          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then TARGET_ARCH="aarch64"; else TARGET_ARCH="x86_64"; fi
          mkdir -p fragments
          scripts/updater-fragment.sh fragments/macos.json "darwin-${TARGET_ARCH}" app "$UPDATER_FILE"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            release-assets/trace-${{ env.RELEASE_TAG }}-macos-app.zip
            release-assets/trace-${{ env.RELEASE_TAG }}-macos.dmg
            release-assets/trace-${{ env.RELEASE_TAG }}-macos-updater.tar.gz
            release-assets/trace-${{ env.RELEASE_TAG }}-macos-updater.tar.gz.sig

      - name: Keep updater fragment for the manifest
        uses: actions/upload-artifact@v4
        with:
          name: updater-macos
          path: fragments/macos.json
          if-no-files-found: ignore

  linux:
    name: Build Linux release
    # The oldest supported glibc, so the builds also run on newer distributions.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Install system libraries
        run: scripts/install-linux-build-deps.sh

      - name: Prepare
        id: setup
        uses: ./.github/actions/release-setup
        with:
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build app (+ updater artifacts when signing is enabled)
        env:
          HAS_SIGNING: ${{ steps.setup.outputs.has_signing }}
        run: |
          set -euo pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            npx tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --bundles appimage,deb
          fi

      - name: Package release assets
        env:
          HAS_SIGNING: ${{ steps.setup.outputs.has_signing }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          BUNDLE="src-tauri/target/release/bundle"
          mkdir -p release-assets fragments
          APPIMAGE="trace-${TAG}-linux-x86_64.AppImage"
          cp "$(find "$BUNDLE/appimage" -maxdepth 1 -name '*.AppImage' | head -n 1)" "release-assets/$APPIMAGE"
          cp "$(find "$BUNDLE/deb" -maxdepth 1 -name '*.deb' | head -n 1)" "release-assets/trace-${TAG}-linux-amd64.deb"

          if [ "$HAS_SIGNING" != "true" ]; then
            echo "Updater signing disabled; skipping updater assets."
            exit 0
          fi
          # Only the AppImage can update itself: a .deb is updated by reinstalling it.
          cp "$(find "$BUNDLE/appimage" -maxdepth 1 -name '*.AppImage.sig' | head -n 1)" "release-assets/${APPIMAGE}.sig"
          scripts/updater-fragment.sh fragments/linux.json linux-x86_64 appimage "$APPIMAGE"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            release-assets/trace-${{ env.RELEASE_TAG }}-linux-x86_64.AppImage
            release-assets/trace-${{ env.RELEASE_TAG }}-linux-x86_64.AppImage.sig
            release-assets/trace-${{ env.RELEASE_TAG }}-linux-amd64.deb

      - name: Keep updater fragment for the manifest
        uses: actions/upload-artifact@v4
        with:
          name: updater-linux
          path: fragments/linux.json
          if-no-files-found: ignore

  windows:
    name: Build Windows release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Prepare
        id: setup
        uses: ./.github/actions/release-setup
        with:
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build app (+ updater artifacts when signing is enabled)
        env:
          HAS_SIGNING: ${{ steps.setup.outputs.has_signing }}
        run: |
          set -euo pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --bundles nsis
          fi

      - name: Package release assets
        env:
          HAS_SIGNING: ${{ steps.setup.outputs.has_signing }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          BUNDLE="src-tauri/target/release/bundle/nsis"
          mkdir -p release-assets fragments
          INSTALLER="trace-${TAG}-windows-x86_64-setup.exe"
          cp "$(find "$BUNDLE" -maxdepth 1 -name '*-setup.exe' | head -n 1)" "release-assets/$INSTALLER"

          if [ "$HAS_SIGNING" != "true" ]; then
            echo "Updater signing disabled; skipping updater assets."
            exit 0
          fi
          cp "$(find "$BUNDLE" -maxdepth 1 -name '*-setup.exe.sig' | head -n 1)" "release-assets/${INSTALLER}.sig"
          scripts/updater-fragment.sh fragments/windows.json windows-x86_64 nsis "$INSTALLER"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            release-assets/trace-${{ env.RELEASE_TAG }}-windows-x86_64-setup.exe
            release-assets/trace-${{ env.RELEASE_TAG }}-windows-x86_64-setup.exe.sig

      - name: Keep updater fragment for the manifest
        uses: actions/upload-artifact@v4
        with:
          name: updater-windows
          path: fragments/windows.json
          if-no-files-found: ignore

  manifest:
    name: Publish latest.json
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Collect each OS's updater fragment
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          merge-multiple: true
          path: fragments

      - name: Merge fragments
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(ls fragments 2>/dev/null)" ]; then
            echo "Updater signing disabled; no latest.json to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUBLISHED_AT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt')"
          if [ -z "${PUBLISHED_AT:-}" ] || [ "$PUBLISHED_AT" = "null" ]; then
            echo "::error::Unable to determine publishedAt for release tag '$RELEASE_TAG'."
            exit 1
          fi
          # The real release notes ride in latest.json so the app can show users
          # what changed before they install.
          VERSION="${RELEASE_TAG#v}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' \
            > release-notes.txt || echo "Release $VERSION" > release-notes.txt
          scripts/updater-manifest.sh fragments "$VERSION" "$PUBLISHED_AT" release-notes.txt latest.json
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Upload latest.json to release
        if: steps.merge.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: latest.json
