# Builds and tests the backend on every supported OS, because a Mac can only check
# the macOS build. Separate from PR CI, which stays off for now: this runs by hand,
# on the port's branches, and when `main` changes something platform-sensitive.
name: Cross-platform

on:
  workflow_dispatch:
  push:
    branches: [main, "port/**"]
    paths:
      - "src-tauri/**"
      - "src/platform/**"
      - "scripts/**"
      - ".github/workflows/cross-platform.yml"

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04: the oldest supported glibc, so builds run on newer distros too.
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-deps.sh

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Platform boundary
        shell: bash
        run: scripts/check-platform-boundary.sh

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::disallowed_methods

      - name: Test
        # Every test target, even after a failure: one OS's bug shouldn't hide another's.
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

  # Real installers, without publishing anything: how to get a build onto a test machine,
  # and proof the release workflow's packaging still works. Unsigned, so they can't update.
  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
            path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            bundles: nsis
            path: src-tauri/target/release/bundle/nsis/*-setup.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-deps.sh

      - name: Build installers
        shell: bash
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.os }}
          path: ${{ matrix.path }}
          if-no-files-found: error
