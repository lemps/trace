# Builds and tests the backend on every supported OS, because a Mac can only check
# the macOS build. Separate from PR CI, which stays off for now: this runs by hand,
# on the port's branches, and when `main` changes something platform-sensitive.
name: Cross-platform

on:
  workflow_dispatch:
  push:
    branches: [main, "port/**"]
    paths:
      - "src-tauri/**"
      - "src/platform/**"
      - ".github/workflows/cross-platform.yml"

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04: the oldest supported glibc, so builds run on newer distros too.
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
