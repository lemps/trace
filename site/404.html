<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · trace</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" sizes="32x32" href="/trace/assets/favicon-32.png" />
    <link rel="stylesheet" href="/trace/css/tokens.css" />
    <link rel="stylesheet" href="/trace/css/base.css" />
    <link rel="stylesheet" href="/trace/css/sections.css" />
    <script>
      try {
        const t = localStorage.getItem("trace-site-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <main class="lost">
      <img src="/trace/assets/icon-64.png" alt="" width="48" height="48" style="margin: 0 auto 8px" />
      <h1>Page not found</h1>
      <p>There's nothing at this address. The homepage has every feature and the downloads.</p>
      <p><a class="btn primary" href="/trace/">Go to the homepage</a></p>
    </main>
  </body>
</html>
